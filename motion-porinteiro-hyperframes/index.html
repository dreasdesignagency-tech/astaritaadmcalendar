<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 400 600;
        src: url("assets/fonts/fraunces.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-style: italic;
        font-weight: 400;
        src: url("assets/fonts/fraunces-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-style: normal;
        font-weight: 400 700;
        src: url("assets/fonts/montserrat.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f8e3e8;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f8e3e8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25.4"
      data-width="1080"
      data-height="1920"
    >
      <!-- A peça visual fica em compositions/peca.html -->
      <div
        id="peca"
        data-composition-id="peca"
        data-composition-src="compositions/peca.html"
        data-start="0"
        data-duration="25.4"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Trilha (já com a redução de volume embaixo da voz) -->
      <audio
        id="trilha"
        src="assets/audio/trilha.mp3"
        data-start="0"
        data-duration="25.33"
        data-track-index="1"
        data-volume="1"
      ></audio>

      <!-- Narração: uma fala por cena -->
      <audio
        id="voz-1"
        src="assets/audio/voz-1.mp3"
        data-start="0.9"
        data-duration="1.9"
        data-track-index="2"
      ></audio>
      <audio
        id="voz-2"
        src="assets/audio/voz-2.mp3"
        data-start="3.3"
        data-duration="3.46"
        data-track-index="2"
      ></audio>
      <audio
        id="voz-3"
        src="assets/audio/voz-3.mp3"
        data-start="7.3"
        data-duration="4.27"
        data-track-index="2"
      ></audio>
      <audio
        id="voz-4"
        src="assets/audio/voz-4.mp3"
        data-start="12.12"
        data-duration="4.57"
        data-track-index="2"
      ></audio>
      <audio
        id="voz-5"
        src="assets/audio/voz-5.mp3"
        data-start="17.19"
        data-duration="2.69"
        data-track-index="2"
      ></audio>
      <audio
        id="voz-6"
        src="assets/audio/voz-6.mp3"
        data-start="20.47"
        data-duration="1.86"
        data-track-index="2"
      ></audio>
    </div>

    <script>
      // A animação vive na sub-composição; a raiz só segura a linha do tempo principal
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
